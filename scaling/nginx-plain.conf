# Round-robins over every replica of the `app` service (Docker's DNS returns
# one address per replica; nginx resolves them at start).
worker_processes 2;
events { worker_connections 4096; }
http {
  access_log off;
  upstream app {
    server app:8080;
    keepalive 128;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Client $http_x_client;
    }
  }
}
