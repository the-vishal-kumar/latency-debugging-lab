; Transaction pooling: a server connection is lent to a client only for the
; length of one transaction, so many client connections share a few.
[databases]
lab = host=postgres port=5432 dbname=lab

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 20
max_client_conn = 1000
; lets pgx's prepared statements work in transaction mode (PgBouncer 1.21+)
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
