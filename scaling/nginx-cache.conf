# The same, plus a 1-second "micro-cache": nginx answers repeated requests
# from memory for as long as the app's Cache-Control allows (max-age=1),
# and lets only one request per key through to the app when it expires.
worker_processes 2;
events { worker_connections 4096; }
http {
  access_log off;
  proxy_cache_path /tmp/cache keys_zone=micro:10m max_size=100m inactive=10s;
  upstream app {
    server app:8080;
    keepalive 128;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Client $http_x_client;
      proxy_cache micro;
      proxy_cache_key $request_uri;
      proxy_cache_lock on;          # one request per key refreshes; the rest wait for it
      proxy_cache_use_stale updating;
      add_header X-Cache $upstream_cache_status;
    }
  }
}
